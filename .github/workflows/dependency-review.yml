name: Dependency Review

# Reviews the dep diff on PRs targeting main for known CVEs and license drift.
#
# This is the *blocking* dependency gate, and it is the only one. It is diff-scoped:
# it asks whether this PR introduces a bad dependency, which is a question whose
# answer does not change after the fact. The whole-tree `pnpm audit` sweep — whose
# answer does change, whenever the advisory database moves — runs on a schedule in
# security-audit.yml instead. See docs/adr/0004-dependency-cve-gates.md.
on:
  pull_request:
    branches: [main]

permissions:
  contents: read
  pull-requests: write

jobs:
  review:
    name: Review
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Dependency Review
        uses: actions/dependency-review-action@v5.0.0
        with:
          # Fail the PR when a new dep introduces a CVE at moderate severity or
          # above. Same threshold the scheduled sweep in security-audit.yml uses,
          # so the blocking gate and the advisory sweep agree on what counts.
          fail-on-severity: moderate

          # SPDX identifiers permitted for newly-added deps. Every package in the
          # lockfile resolves to one of these — GSAP relicensed to MIT in v3.13
          # (May 2024) and is on ^3.15.0 here.
          #
          # Two non-permissive entries, both deliberate:
          #   - OFL-1.1 covers the three @fontsource-variable/* packages. It is the
          #     standard open font license; self-hosting is exactly what it permits.
          #   - LGPL-3.0-or-later covers sharp's @img/sharp-libvips-* binaries. sharp
          #     runs at build time only — astro:assets generates AVIF/WebP during
          #     `pnpm build` and the binaries never ship in dist/ — so the copyleft
          #     terms do not reach the built site. Some @img platform packages carry
          #     compound expressions (`Apache-2.0 AND LGPL-3.0-or-later`), which the
          #     action only clears when every operand is listed.
          allow-licenses: MIT, Apache-2.0, BSD-2-Clause, BSD-3-Clause, ISC, 0BSD, BlueOak-1.0.0, CC0-1.0, Unlicense, MPL-2.0, OFL-1.1, LGPL-3.0-or-later

          # Allow-list GitHub Actions whose licenses dependency-review-action can't
          # auto-detect. Confirmed by inspection of their upstream repos:
          #   - actions/checkout, actions/setup-node: MIT (github.com/actions/*).
          #   - pnpm/action-setup: MIT (github.com/pnpm/action-setup).
          #   - treosh/lighthouse-ci-action: Apache-2.0.
          # The action doesn't read LICENSE files of action repos consistently.
          allow-dependencies-licenses: >-
            pkg:githubactions/actions/checkout,
            pkg:githubactions/actions/setup-node,
            pkg:githubactions/pnpm/action-setup,
            pkg:githubactions/treosh/lighthouse-ci-action

          # Post a summary comment on each PR so the diff is visible without
          # opening the workflow logs.
          comment-summary-in-pr: always
