name: Dependency Review

# Reviews the dep diff on every PR for known CVEs and license drift. Complements
# the `pnpm audit` step (in ci.yml) which scans already-installed deps: this one
# catches newly-introduced deps before they merge.
on:
  pull_request:

permissions:
  contents: read
  pull-requests: write

jobs:
  review:
    name: Review
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Dependency Review
        uses: actions/dependency-review-action@v5.0.0
        with:
          # Fail the PR when a new dep introduces a CVE at moderate severity or
          # above. Matches the threshold ci.yml's `pnpm audit` step uses, so the
          # two gates agree.
          fail-on-severity: moderate

          # SPDX identifiers permitted for newly-added deps. Every package in the
          # lockfile resolves to one of these — GSAP relicensed to MIT in v3.13
          # (May 2024) and is on ^3.15.0 here.
          allow-licenses: MIT, Apache-2.0, BSD-2-Clause, BSD-3-Clause, ISC, 0BSD, BlueOak-1.0.0, CC0-1.0, Unlicense, MPL-2.0

          # Allow-list GitHub Actions whose licenses dependency-review-action can't
          # auto-detect. Confirmed by inspection of their upstream repos:
          #   - actions/checkout, actions/setup-node: MIT (github.com/actions/*).
          #   - pnpm/action-setup: MIT (github.com/pnpm/action-setup).
          #   - treosh/lighthouse-ci-action: Apache-2.0.
          # The action doesn't read LICENSE files of action repos consistently.
          allow-dependencies-licenses: >-
            pkg:githubactions/actions/checkout,
            pkg:githubactions/actions/setup-node,
            pkg:githubactions/pnpm/action-setup,
            pkg:githubactions/treosh/lighthouse-ci-action

          # Post a summary comment on each PR so the diff is visible without
          # opening the workflow logs.
          comment-summary-in-pr: always
