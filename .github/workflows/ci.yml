name: CI

# Runs the same verify gate developers run locally (format, lint, typecheck, test,
# build) on every PR and on every push to non-main branches. Push to main is already
# covered by deploy.yml, which runs `pnpm verify` before shipping — duplicating that
# here would double CI minutes for zero extra signal.
on:
  pull_request:
  push:
    branches-ignore: [main]

permissions:
  contents: read

# Cancel an in-progress run when a new commit lands on the same ref. Opposite of
# deploy.yml (which serializes), because PR pushes happen often and the latest commit
# is the only one whose result matters.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    # Single Node 22 — matches engines.node in package.json. No matrix: this is a
    # static site, not a library, so multi-version coverage adds CI minutes for zero
    # downstream consumers. Revisit if this ever ships as an npm package.
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: package.json
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify (format, lint, typecheck, test, build)
        # PUBLIC_WEB3FORMS_ACCESS_KEY is intentionally unset: the build reads it as ""
        # via the `?? ""` fallback in src/pages/contact.astro and produces a working
        # bundle. The contact form's POST won't have a usable key in PR builds, but
        # neither `pnpm build` nor any test exercises that surface. Set repo variable
        # PUBLIC_WEB3FORMS_ACCESS_KEY_CI and pass it through here only if you ever
        # want PR-built sites to ship a working form.
        run: pnpm verify

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          retention-days: 7
