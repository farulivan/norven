name: CI

# Runs the same verify gate I run locally (format, lint, typecheck, test, build) on
# every main-bound PR. Push to main is already covered by deploy.yml, which runs
# `pnpm verify` before shipping — duplicating that here would double CI minutes for
# zero extra signal.
#
# PR-only, deliberately. This used to also trigger on `push: branches-ignore: [main]`
# so a branch got CI before its PR existed. But a branch with an open PR matches both
# triggers, so every PR ran Verify twice — and since Verify is the required status
# check on main, two workflows publishing the same check name is a genuinely ambiguous
# merge state, not just wasted minutes. e2e.yml and lighthouse.yml scope both triggers
# to main for the same reason. Nothing is lost for Renovate; its branches always have
# a PR. Open a draft PR to get CI on work in progress.
on:
  pull_request:
    branches: [main]

permissions:
  contents: read

# Cancel an in-progress run when a new commit lands on the same ref. Opposite of
# deploy.yml (which serializes), because PR pushes happen often and only the latest
# commit matters.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    # Single Node 22 — matches engines.node in package.json. No matrix: this is a
    # static site, not a library, so multi-version coverage adds CI minutes for zero
    # downstream consumers. I will revisit if this ever ships as an npm package.
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # commitlint needs git history back to the PR base. fetch-depth: 0
          # is the simplest path; the repo is small so the cost is negligible.
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version-file: package.json
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint commit messages
        # Validates every commit between origin/main and HEAD against the
        # Conventional Commits ruleset. Catches PRs where a contributor used
        # `git commit --no-verify` to bypass the local lefthook hook.
        if: github.event_name == 'pull_request'
        run: pnpm exec commitlint --from=origin/${{ github.event.pull_request.base.ref }} --to=HEAD

      - name: Audit dependencies
        # Scans the already-installed dep tree for known CVEs at moderate severity
        # or above. Complements the dependency-review workflow, which only checks
        # newly-introduced deps on a PR. If a transient advisory ever blocks a PR
        # without an upstream fix, loosen the threshold to `--audit-level=high`
        # rather than reintroducing `continue-on-error`.
        run: pnpm audit --audit-level=moderate

      - name: Verify (format, lint, typecheck, test, build, bundle budget)
        # PUBLIC_WEB3FORMS_ACCESS_KEY is intentionally unset: the build reads it as ""
        # via the `?? ""` fallback in src/pages/contact.astro and produces a working
        # bundle. The contact form's POST won't have a usable key in PR builds, but
        # neither `pnpm build` nor any test exercises that surface. Set repo variable
        # PUBLIC_WEB3FORMS_ACCESS_KEY_CI and pass it through here only if I ever
        # want PR-built sites to ship a working form.
        run: pnpm verify

      - name: Upload build artifact
        uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/
          retention-days: 7
