name: CodeQL

# Static analysis for JS/TS via GitHub-native CodeQL. Free for public repos,
# results land in the Security → Code scanning tab.
#
# I rejected sonarcloud / semgrep / snyk here: each adds an external account, paid
# tier above trivial usage, and another login to maintain — for one small static
# site CodeQL covers the same ground with no new vendor.
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  # Weekly catches new CodeQL rule packs that flag existing code I would otherwise
  # miss between main merges. Mondays 06:00 UTC = before the work-week starts in
  # EU/SEA.
  schedule:
    - cron: "0 6 * * 1"

permissions:
  contents: read
  security-events: write
  actions: read

# Multiple pushes/PRs in flight don't need to queue — only the latest matters.
concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Analyze
    runs-on: ubuntu-latest
    # Findings land in Security → Code scanning. Keep informational until a few
    # green cycles, then promote to a required check on main-bound PRs via
    # branch protection.
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: javascript-typescript
          # Inline config keeps the workflow self-contained — no separate
          # .github/codeql/config.yml file to discover.
          config: |
            paths-ignore:
              - dist
              - .astro
              - node_modules

      - name: Analyze
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:javascript-typescript"
