name: Lighthouse

# Per-page performance/a11y/best-practices/SEO budgets via Lighthouse CI.
# Median of 3 runs (configured in .lighthouserc.json) to absorb runner CPU
# jitter; I tune assertions slightly above the site's current scores so a
# regression fails the PR, not a routine landed change.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read
  pull-requests: write # for the LHCI bot to post the per-page summary

concurrency:
  group: lighthouse-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lhci:
    name: Lighthouse CI
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: package.json
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build site
        run: pnpm build

      - name: Run Lighthouse CI
        # treosh's action wraps `lhci autorun`, posts a per-page comment, and
        # uploads the median report to LHCI's temporary public storage.
        # I rejected Google's lighthouse-ci-action: it needs more wiring for the
        # PR-comment shape I want.
        uses: treosh/lighthouse-ci-action@v12
        with:
          configPath: ./.lighthouserc.json
          uploadArtifacts: true
          temporaryPublicStorage: true
