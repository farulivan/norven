allowBuilds:
  esbuild: true
  lefthook: true
  sharp: true

# I force-upgrade transitive deps to versions that fix known CVEs. The first
# two are pulled in by @lhci/cli; upstream lhci hasn't shipped a fix. Those
# advisories are dev-only (lhci runs only in CI), but the dependency-review
# gate flags them anyway, so I patch the lockfile in place.
#   - tmp >=0.2.4    : GHSA-52f5-9888-hmc6 (path traversal via unsanitized prefix)
#   - uuid >=11.1.1  : multiple CVEs in <11.1.1, including the missing-bounds-
#                      check in v3/v5/v6 and a later weak-randomness fix.
#   - yaml >=2.8.3   : GHSA-48c2-rrv3-qjmp (stack overflow via deeply nested
#                      collections). Pulled in by @astrojs/check via
#                      yaml-language-server; targeted at the vulnerable range
#                      so vite's already-patched yaml@2.9.0 is untouched.
overrides:
  tmp: ^0.2.4
  uuid: ^14.0.0
  yaml@<2.8.3: ^2.8.3
