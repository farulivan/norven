allowBuilds:
  esbuild: true
  lefthook: true
  sharp: true

# I force-upgrade transitive deps to versions that fix known CVEs. Each entry is
# range-targeted so a package that legitimately wants a newer major isn't dragged
# backwards.
#   - yaml >=2.8.3     : GHSA-48c2-rrv3-qjmp (stack overflow via deeply nested
#                        collections). Pulled in by @astrojs/check via
#                        yaml-language-server; targeted at the vulnerable range
#                        so vite's already-patched yaml@2.9.0 is untouched.
#   - fast-uri >=3.1.6 : GHSA-jqff-g426-hqxp (host confusion via percent-encoded
#                        scheme normalization). Reaches the tree through ajv,
#                        under both @astrojs/check and @commitlint/cli. Held to
#                        the 3.x line because ajv's peer range is ^3.
#   - nanoid >=3.3.18  : GHSA-2v37-7h3g-55p8 (custom generators loop forever when
#                        size is zero). Comes via postcss, under astro, vite and
#                        vitest. Build-time only — nanoid never ships in dist/.
overrides:
  yaml@<2.8.3: ^2.8.3
  fast-uri@<3.1.6: ^4.0.0
  nanoid@<3.3.18: ^6.0.0
